<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EE4E2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPX Scan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>SPX Scan – Order Pool</title>
<style>
:root{
  --brand:#EE4E2C; --navy:#073763;
  --bg:#f4f6fa; --card:#ffffff; --text:#0b2540; --muted:#6b7a90; --line:#e2e8f0;
  --input:#f7f9fc; --ok:#1a9e5c; --err:#d93025; --shadow:0 6px 20px rgba(7,55,99,.10);
  --r:18px;
}
[data-theme="dark"]{
  --bg:#06182b; --card:#0d2a47; --text:#eaf1f9; --muted:#8fa6bf; --line:#1d4166;
  --input:#0a2239; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),#c93a1c 60%,var(--navy));color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ttl{flex:1;min-width:0;line-height:1.15}
.ttl b{font-size:17px;display:block}
.clock{font-variant-numeric:tabular-nums;font-size:12.5px;opacity:.92}
.ib{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;transition:.2s}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.3)}
.ib.sm{width:32px;height:32px;border-radius:10px}.ib.sm svg{width:16px;height:16px}

main{max-width:560px;margin:14px auto 0;padding:0 14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px;letter-spacing:.3px;text-transform:uppercase}
input,select{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--input);color:var(--text);padding:0 13px;font-size:16px;outline:0;transition:.2s}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(238,78,44,.18)}
input[readonly]{color:var(--navy);font-weight:600}
[data-theme="dark"] input[readonly]{color:#ffd2c6}
.stats{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 10px;font-size:13px;color:var(--muted)}
.stats b{color:var(--brand);font-size:15px}

/* Row */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:12px;animation:pop .28s ease;position:relative}
.row.dup{border-color:var(--err);box-shadow:0 0 0 3px rgba(217,48,37,.15)}
.row.ok{border-color:var(--ok)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.idx{background:var(--navy);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px}
.del{width:32px;height:32px;border-radius:10px;background:rgba(217,48,37,.1);color:var(--err);display:grid;place-items:center}
.del:active{transform:scale(.9)}
.fl{display:flex;gap:8px}
.scan{width:46px;height:46px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(238,78,44,.4);flex:none}
.scan:active{transform:scale(.92)}
.msg{font-size:12.5px;min-height:0;margin:5px 3px 0;font-weight:600}
.msg.e{color:var(--err)}.msg.o{color:var(--ok)}
.f{margin-top:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.wrap{position:relative}
.sug{position:absolute;left:0;right:0;top:50px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 28px rgba(0,0,0,.25);max-height:220px;overflow:auto;display:none}
.sug div{padding:11px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.sug div:last-child{border:0}.sug div:active,.sug div:hover{background:rgba(238,78,44,.12)}
.sug small{color:var(--muted);display:block;font-size:11.5px}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(7,55,99,.12);border-radius:22px 22px 0 0}
.bar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr;gap:10px}
.btn{height:50px;border-radius:15px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn:active{transform:scale(.96)}
.b1{background:rgba(7,55,99,.1);color:var(--navy)}
[data-theme="dark"] .b1{background:rgba(255,255,255,.1);color:#fff}
.b2{background:linear-gradient(135deg,var(--brand),#ff7a4d);color:#fff;box-shadow:0 6px 16px rgba(238,78,44,.4)}
.b3{background:var(--navy);color:#fff}

/* Modal / scanner */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,15,28,.75);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.ov.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);color:var(--text);width:100%;max-width:420px;border-radius:24px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal h3{margin:0 0 12px;font-size:18px}
.modal p{color:var(--muted);font-size:13.5px;margin:8px 0}
.modal .btn{width:100%;margin-top:10px}
#reader{width:100%;border-radius:18px;overflow:hidden;background:#000;min-height:260px}
#reader video{border-radius:18px}
.sc-info{display:flex;justify-content:space-between;font-size:13px;margin:10px 2px 0;color:var(--muted)}
.sc-info b{color:var(--brand)}

.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:80;padding:11px 18px;border-radius:14px;color:#fff;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}.toast.info{background:var(--navy)}
.scan-toast{z-index:90}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <img class="logo" src="icons/logo.png" alt="SPX Express">
    <div class="ttl"><b>SPX Scan</b><span class="clock" id="clock">--:--:--</span></div>
    <button class="ib" id="btnUp" title="Cập nhật DATA" aria-label="Cập nhật DATA"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button>
    <button class="ib" id="btnTheme" title="Sáng/Tối" aria-label="Đổi giao diện"><svg viewBox="0 0 24 24" id="themeIco"></svg></button>
  </div>
</header>

<main>
  <div class="card">
    <label class="l" for="province">Tỉnh</label>
    <select id="province"></select>
  </div>
  <div class="stats"><span>Đã nhập: <b id="cnt">0</b> đơn</span><span id="dataInfo"></span></div>
  <div id="rows"></div>
</main>

<div class="bar"><div>
  <button class="btn b1" id="btnAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Thêm hàng</button>
  <button class="btn b2" id="btnDone"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Xong &amp; xuất Excel</button>
</div></div>

<!-- Scanner -->
<div class="ov" id="scanOv">
  <div class="modal">
    <h3>Quét mã SPX</h3>
    <div id="reader"></div>
    <div class="sc-info"><span>Quét liên tục, tự thêm hàng mới</span><span>Đã quét: <b id="scCnt">0</b></span></div>
    <button class="btn b3" id="scClose">Đóng camera</button>
  </div>
</div>

<!-- Upload DATA -->
<div class="ov" id="upOv">
  <div class="modal">
    <h3>Cập nhật DATA</h3>
    <label class="l" for="pw">Mật khẩu</label>
    <input type="password" id="pw" inputmode="numeric" autocomplete="off" placeholder="Nhập mật khẩu">
    <label class="l" for="fileIn" style="margin-top:10px">File .xlsx (A: Tỉnh, B: Ward, C: Deli station, D: Sort code)</label>
    <input type="file" id="fileIn" accept=".xlsx,.xls" style="padding-top:10px;height:auto;min-height:46px">
    <button class="btn b2" id="upGo">Cập nhật</button>
    <button class="btn b1" id="upReset">Khôi phục DATA gốc</button>
    <button class="btn b1" id="upClose">Đóng</button>
  </div>
</div>

<!-- Done -->
<div class="ov" id="doneOv">
  <div class="modal">
    <h3>Đã xuất file</h3>
    <p id="doneTxt"></p>
    <button class="btn b2" id="dShare">Chia sẻ file</button>
    <button class="btn b3" id="dClear">Xóa danh sách &amp; làm mới</button>
    <button class="btn b1" id="dClose">Đóng</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
'use strict';
const PASS = '111291';
const $ = s => document.querySelector(s);
const strip = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase().replace(/\s+/g,' ').trim();
const nonAscii = s => (s.match(/[^\x00-\x7F]/g) || []).length;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- Âm thanh ---------- */
let actx;
addEventListener('pointerdown', () => { try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }, {once:false});
function beep(ok){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const seq = ok ? [[880,0,.12],[1175,.13,.14]] : [[220,0,.22],[180,.26,.28]];
    seq.forEach(([f,t,d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.35, actx.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + d + .02);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(ok ? 60 : [120,60,120]);
}

/* ---------- Toast ---------- */
let tt;
function toast(msg, type='info', extraClass=''){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + type + ' ' + extraClass;
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Đồng hồ + giao diện ---------- */
const pad = n => String(n).padStart(2,'0');
function tick(){
  const d = new Date(), w = ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()];
  $('#clock').textContent = `${w}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(tick, 1000); tick();
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
function setTheme(t){
  document.documentElement.dataset.theme = t; store.set('spx_theme', t);
  $('#themeIco').innerHTML = t === 'dark' ? SUN : MOON;
}
setTheme(store.get('spx_theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------- DATA ---------- */
let DATA = [], PROVS = [], curPK = '';
function cleanProvince(raw){
  let n = String(raw ?? '').normalize('NFC').replace(/\s+/g,' ').trim();
  if(/^tinh\s/.test(strip(n))) n = n.slice(4).trim();             // bỏ chữ "tỉnh"
  return n.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());  // Viết Hoa Chữ Đầu
}
function buildData(rows){
  const best = {};  // key -> tên có dấu đầy đủ nhất
  rows.forEach(r => {
    const n = cleanProvince(r[0]), k = strip(n);
    if(k && (!best[k] || nonAscii(n) > nonAscii(best[k]))) best[k] = n;
  });
  DATA = rows.filter(r => r[1] && r[2] && r[3]).map(r => {
    const pk = strip(cleanProvince(r[0]));
    return { p: best[pk], pk, w: String(r[1]).trim(), wk: strip(r[1]), h: String(r[2]).trim(), s: String(r[3]).trim() };
  });
  PROVS = [...new Set(DATA.map(d => d.pk))].map(k => ({ k, n: best[k] })).sort((a,b) => a.n.localeCompare(b.n, 'vi'));
}
function fillProvinces(){
  const sel = $('#province'); sel.innerHTML = '';
  PROVS.forEach(p => sel.add(new Option(p.n, p.k)));
  const saved = store.get('spx_prov', '');
  curPK = PROVS.some(p => p.k === saved) ? saved : (PROVS[0] ? PROVS[0].k : '');
  sel.value = curPK;
  $('#dataInfo').textContent = `${DATA.length} phường/xã`;
}
async function loadData(){
  let rows = store.get('spx_data', null);
  if(!rows){
    try{ rows = await (await fetch('data.json', {cache:'no-cache'})).json(); }
    catch(e){ rows = []; toast('Không tải được DATA', 'err'); }
  }
  buildData(rows); fillProvinces();
}

/* ---------- Hàng nhập ---------- */
let rows = store.get('spx_rows', []);
let uid = rows.reduce((m,r) => Math.max(m, r.id), 0);
const save = () => store.set('spx_rows', rows);
const rowsEl = $('#rows');
const ICO_SCAN = '<svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 12h10"/></svg>';
const ICO_DEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';

function newRow(){ const r = { id: ++uid, track:'', ward:'', hub:'', sort:'' }; rows.push(r); return r; }
function getRow(id){ return rows.find(r => r.id === id); }
function isDup(r){ return !!r.track && rows.some(o => o.id !== r.id && o.track === r.track); }
function cleanTrack(v){
  v = String(v || '').trim().toUpperCase().replace(/\s+/g,'');
  const m = v.match(/SPX[A-Z0-9]+/);        // QR dạng link/chuỗi dài -> lấy mã SPX
  return m ? m[0] : v;
}
function resolve(r){
  const it = DATA.find(d => d.pk === curPK && d.wk === strip(r.ward));
  r.hub = it ? it.h : ''; r.sort = it ? it.s : '';
}
function updateCount(){ $('#cnt').textContent = rows.filter(r => r.track).length; }
function refreshStatus(){
  rows.forEach(r => {
    const el = rowsEl.querySelector(`[data-id="${r.id}"]`); if(!el) return;
    const dup = isDup(r), m = el.querySelector('.msg');
    el.classList.toggle('dup', dup); el.classList.toggle('ok', !!r.track && !dup);
    m.className = 'msg ' + (dup ? 'e' : (r.track ? 'o' : ''));
    m.textContent = dup ? '⚠ Mã bị trùng' : (r.track ? '✓ Hợp lệ' : '');
  });
  updateCount();
}
function renumber(){ rowsEl.querySelectorAll('.idx').forEach((e,i) => e.textContent = '#' + (i+1)); }

function renderRow(r){
  const el = document.createElement('div'); el.className = 'row'; el.dataset.id = r.id;
  el.innerHTML = `
    <div class="rh"><span class="idx"></span><button class="del" aria-label="Xóa hàng">${ICO_DEL}</button></div>
    <label class="l">SPX Tracking Number</label>
    <div class="fl"><input class="tk" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Nhập hoặc quét mã"><button class="scan" aria-label="Quét mã">${ICO_SCAN}</button></div>
    <div class="msg"></div>
    <div class="f wrap"><label class="l">Ward</label><input class="wd" type="text" autocomplete="off" placeholder="Gõ tên phường/xã (không cần dấu)"><div class="sug"></div></div>
    <div class="two"><div><label class="l">Hub Name</label><input class="hb" readonly tabindex="-1"></div><div><label class="l">Sort Code New</label><input class="sc" readonly tabindex="-1"></div></div>`;
  const tk = el.querySelector('.tk'), wd = el.querySelector('.wd'), hb = el.querySelector('.hb'), sc = el.querySelector('.sc'), sug = el.querySelector('.sug');
  tk.value = r.track; wd.value = r.ward; hb.value = r.hub; sc.value = r.sort;

  tk.addEventListener('input', () => { r.track = cleanTrack(tk.value); save(); refreshStatus(); });
  tk.addEventListener('change', () => {
    tk.value = r.track = cleanTrack(tk.value); save(); refreshStatus();
    if(r.track){ if(isDup(r)){ beep(false); toast('Mã SPX bị trùng: ' + r.track, 'err'); } else beep(true); }
  });
  tk.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); tk.blur(); wd.focus(); } });
  el.querySelector('.scan').onclick = () => openScanner(r.id);
  el.querySelector('.del').onclick = () => {
    rows = rows.filter(x => x.id !== r.id); el.remove();
    if(!rows.length) addRow(false);
    save(); renumber(); refreshStatus();
  };

  const apply = () => { resolve(r); hb.value = r.hub; sc.value = r.sort; save(); };
  const showSug = () => {
    const q = strip(wd.value), pool = DATA.filter(d => d.pk === curPK);
    let list = q ? pool.filter(d => d.wk.includes(q)) : pool;
    list.sort((a,b) => (b.wk.startsWith(q) - a.wk.startsWith(q)) || a.w.localeCompare(b.w, 'vi', {numeric:true}));
    sug.innerHTML = '';
    list.slice(0, 40).forEach(d => {
      const o = document.createElement('div'); o.textContent = d.w;
      const s = document.createElement('small'); s.textContent = d.h; o.appendChild(s);
      o.onclick = () => { wd.value = r.ward = d.w; apply(); sug.style.display = 'none'; };
      sug.appendChild(o);
    });
    sug.style.display = list.length ? 'block' : 'none';
  };
  wd.addEventListener('input', () => { r.ward = wd.value; apply(); showSug(); });
  wd.addEventListener('focus', showSug);
  wd.addEventListener('blur', () => setTimeout(() => sug.style.display = 'none', 200));
  wd.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); const f = sug.firstChild; if(f && !r.hub) f.click(); wd.blur(); } });
  return el;
}
function addRow(focus = true){
  const r = newRow(), el = renderRow(r); rowsEl.appendChild(el);
  renumber(); refreshStatus(); save();
  if(focus){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.querySelector('.tk').focus({preventScroll:true}); }
  return r;
}
function renderAll(){
  rowsEl.innerHTML = '';
  if(!rows.length) newRow();
  rows.forEach(r => rowsEl.appendChild(renderRow(r)));
  renumber(); refreshStatus();
}
$('#btnAdd').onclick = () => addRow(true);
$('#province').onchange = e => {
  curPK = e.target.value; store.set('spx_prov', curPK);
  rows.forEach(resolve); save(); renderAll();
};

/* ---------- Scanner (camera) ---------- */
let scanner = null, scTarget = 0, scCount = 0, lastTxt = '', lastTime = 0, scBusy = false;
async function openScanner(id){
  if(scBusy) return; scBusy = true;
  scTarget = id; scCount = 0; $('#scCnt').textContent = 0;
  $('#scanOv').classList.add('show');
  try{
    if(typeof Html5Qrcode === 'undefined') throw new Error('Chưa tải được thư viện quét (cần mạng lần đầu)');
    scanner = new Html5Qrcode('reader', { verbose:false, experimentalFeatures:{ useBarCodeDetectorIfSupported:true } });
    const F = Html5QrcodeSupportedFormats;
    await scanner.start({ facingMode:'environment' },
      { fps:12, qrbox:(w,h) => { const s = Math.floor(Math.min(w,h)*.72); return {width:s, height:s}; },
        formatsToSupport:[F.QR_CODE, F.CODE_128, F.CODE_39, F.EAN_13] },
      onScan, () => {});
  }catch(e){
    toast('Không mở được camera: ' + (e && e.message ? e.message : 'hãy cấp quyền camera'), 'err', 'scan-toast');
    await closeScanner();
  }
  scBusy = false;
}
async function closeScanner(){
  try{ if(scanner){ if(scanner.isScanning) await scanner.stop(); scanner.clear(); } }catch(e){}
  scanner = null; $('#scanOv').classList.remove('show'); scBusy = false;
}
function onScan(text){
  const now = Date.now(), code = cleanTrack(text);
  if(!code || (code === lastTxt && now - lastTime < 2500)) return;   // chống đọc lặp
  lastTxt = code; lastTime = now;
  let r = getRow(scTarget);
  if(!r || r.track){ r = rows.find(x => !x.track) || addRow(false); }
  if(rows.some(o => o.id !== r.id && o.track === code)){
    beep(false); toast('TRÙNG: ' + code, 'err', 'scan-toast'); return;
  }
  r.track = code; save();
  const el = rowsEl.querySelector(`[data-id="${r.id}"]`);
  if(el) el.querySelector('.tk').value = code;
  scCount++; $('#scCnt').textContent = scCount;
  beep(true); toast('Đã quét: ' + code, 'ok', 'scan-toast');
  refreshStatus();
  const nxt = rows.find(x => !x.track) || addRow(false);   // sẵn hàng trống cho lần quét kế tiếp
  scTarget = nxt.id;
}
$('#scClose').onclick = closeScanner;

/* ---------- Upload DATA ---------- */
const upOv = $('#upOv');
$('#btnUp').onclick = () => { $('#pw').value = ''; $('#fileIn').value = ''; upOv.classList.add('show'); };
$('#upClose').onclick = () => upOv.classList.remove('show');
$('#upReset').onclick = async () => {
  if($('#pw').value !== PASS) return toast('Sai mật khẩu', 'err');
  store.del('spx_data'); await loadData(); rows.forEach(resolve); renderAll(); upOv.classList.remove('show'); toast('Đã khôi phục DATA gốc', 'ok');
};
$('#upGo').onclick = async () => {
  if($('#pw').value !== PASS){ beep(false); return toast('Sai mật khẩu', 'err'); }
  const f = $('#fileIn').files[0]; if(!f) return toast('Chưa chọn file', 'err');
  try{
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
    const data = aoa.slice(1).map(r => [r[0], r[1], r[2], r[3]].map(c => String(c ?? '').trim())).filter(r => r[1] && r[2] && r[3]);
    if(!data.length) throw new Error('File không có dữ liệu hợp lệ');
    store.set('spx_data', data); buildData(data); fillProvinces();
    rows.forEach(resolve); renderAll(); upOv.classList.remove('show');
    beep(true); toast(`Đã cập nhật ${data.length} dòng`, 'ok');
  }catch(e){ beep(false); toast('Lỗi file: ' + e.message, 'err'); }
};

/* ---------- Xong & xuất Excel ---------- */
let lastFile = null;
$('#btnDone').onclick = () => {
  const filled = rows.filter(r => r.track);
  if(!filled.length) return toast('Chưa có mã SPX nào', 'err');
  const dups = filled.filter(isDup).length;
  if(dups) return toast(`Còn ${dups} mã trùng, hãy xóa trước khi xuất`, 'err');
  const bad = filled.filter(r => !r.hub || !r.sort).length;
  if(bad && !confirm(`${bad} hàng chưa có Hub/Sort code. Vẫn xuất?`)) return;
  const aoa = [['SPX Tracking Number','Hub Name','Sort Code','Ward(Optional)'], ...filled.map(r => [r.track, r.hub, r.sort, ''])];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:26},{wch:28},{wch:22},{wch:16}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const d = new Date(), ts = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  const name = `order_pool_mass_update_template_vn_with_optional_ward_${ts}.xlsx`;
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  lastFile = new File([blob], name, {type: blob.type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  beep(true);
  $('#doneTxt').textContent = `${filled.length} đơn · ${name}`;
  $('#doneOv').classList.add('show');
};
$('#dClose').onclick = () => $('#doneOv').classList.remove('show');
$('#dClear').onclick = () => { rows = []; renderAll(); save(); $('#doneOv').classList.remove('show'); toast('Đã làm mới', 'info'); };
$('#dShare').onclick = async () => {
  try{
    if(lastFile && navigator.canShare && navigator.canShare({files:[lastFile]})) await navigator.share({files:[lastFile], title:lastFile.name});
    else toast('Thiết bị không hỗ trợ chia sẻ file, hãy dùng file vừa tải về', 'info');
  }catch(e){ /* người dùng hủy */ }
};

/* ---------- Khởi động ---------- */
loadData().then(() => { rows.forEach(resolve); renderAll(); });
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
